[project]
name = "lecture-1-intro"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.23.16",
    "pymupdf>=1.24",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "scipy>=1.13",
    "polars>=1.0",
    "altair>=5.3",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
]

[tool.marimo.runtime]
pythonpath = ["../../src"]
